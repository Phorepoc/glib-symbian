# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml). ".hildon/..." resolves to $PHOREPOC_BUILD/hildon/
# (paths.resolve) and registry/ is merged into core's registry. NOT RELEASED YET: package.yml needs recipes/prebuild.sh, the
# in-container form of recipes/build.sh (the archives under $PHOREPOC_BUILD/hildon/); until then tools/hildon_sis.py makes the same files.
NAME=glib-symbian
ARCHES="x32"
IMAGE=ghcr.io/phorepoc/web
REPOS_x32="cxxrt"
COMPONENTS_x32="pheglib phegobject phegmodule phegthread phegio"
