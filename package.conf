# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml). ".hildon/..." resolves to $PHOREPOC_BUILD/hildon/
# (paths.resolve) and registry/ is merged into core's registry.
# recipes/prebuild.sh builds the archives under $PHOREPOC_BUILD/hildon/, the stack's lower layers first (glib-symbian's recipes/stack_env.sh).
NAME=glib-symbian
ARCHES="x32"
IMAGE=ghcr.io/phorepoc/web
REPOS_x32="cxxrt"
COMPONENTS_x32="pheglib phegobject phegmodule phegthread phegio"
